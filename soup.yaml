base: Qwen/Qwen2.5-1.5B-Instruct
task: sft

data:
  train: ./train_alpaca_v2.jsonl
  format: alpaca
  val_split: 0.1
  max_length: 1536

training:
  epochs: 3
  lr: 2e-5
  batch_size: 1
  gradient_accumulation_steps: 4
  lora:
    r: 16
    alpha: 32
    target_modules: auto
  quantization: 4bit

output: ./output
